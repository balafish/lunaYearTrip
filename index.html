<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 過年宜蘭行</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
--red: #C0392B;
--red-light: #E74C3C;
--red-dark: #962D22;
--gold: #F4C430;
--gold-light: #FFEAA7;
--cream: #FFF8F0;
--dark: #1A1A2E;
--dark2: #16213E;
--text: #2C3E50;
--text-light: #7F8C8D;
--green: #27AE60;
--orange: #E67E22;
--blue: #2980B9;
--panel-bg: rgba(255,248,240,0.97);
--shadow: 0 8px 32px rgba(0,0,0,0.18);
--radius: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans TC',sans-serif; background:var(--dark); color:var(--text); overflow:hidden; height:100vh; width:100vw; }
/* ===== MAP ===== */
#map { width:100%; height:100vh; z-index:1; }
/* ===== HEADER ===== */
.header {
position:fixed; top:0; left:0; right:0; z-index:1000;
background:linear-gradient(135deg, var(--red-dark), var(--red));
padding:12px 20px;
display:flex; align-items:center; justify-content:space-between;
box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.header h1 {
font-family:'Playfair Display','Noto Sans TC',serif;
font-size:1.4rem; color:#fff; letter-spacing:2px;
text-shadow:0 2px 8px rgba(0,0,0,0.3);
}
.header .subtitle { font-size:0.75rem; color:var(--gold-light); font-weight:300; margin-left:12px; }
.menu-btn {
width:44px; height:44px; border:none; background:rgba(255,255,255,0.15);
border-radius:12px; cursor:pointer; display:flex; flex-direction:column;
align-items:center; justify-content:center; gap:5px; transition:all 0.3s;
}
.menu-btn:hover { background:rgba(255,255,255,0.25); }
.menu-btn span { width:22px; height:2px; background:#fff; border-radius:2px; transition:all 0.3s; }
.menu-btn.active span:nth-child(1) { transform:rotate(45deg) translate(5px,5px); }
.menu-btn.active span:nth-child(2) { opacity:0; }
.menu-btn.active span:nth-child(3) { transform:rotate(-45deg) translate(5px,-5px); }
/* ===== TIMELINE BAR ===== */
.timeline-bar {
position:fixed; top:68px; left:0; right:0; z-index:999;
background:rgba(26,26,46,0.92); backdrop-filter:blur(12px);
padding:10px 16px; display:flex; gap:6px; overflow-x:auto;
-webkit-overflow-scrolling:touch;
}
.timeline-bar::-webkit-scrollbar { display:none; }
.day-tab {
flex-shrink:0; padding:8px 18px; border-radius:24px;
border:2px solid rgba(255,255,255,0.15); background:transparent;
color:rgba(255,255,255,0.7); font-size:0.8rem; font-weight:500;
cursor:pointer; transition:all 0.3s; white-space:nowrap;
}
.day-tab:hover { border-color:var(--gold); color:var(--gold); }
.day-tab.active { background:var(--gold); color:var(--dark); border-color:var(--gold); font-weight:700; }
.day-tab .day-label { font-size:0.65rem; opacity:0.7; }
/* ===== SIDE MENU ===== */
.side-menu {
position:fixed; top:0; right:-420px; width:400px; max-width:90vw; height:100vh;
background:var(--panel-bg); z-index:1100; transition:right 0.4s cubic-bezier(0.4,0,0.2,1);
box-shadow:-8px 0 40px rgba(0,0,0,0.3); overflow-y:auto;
}
.side-menu.open { right:0; }
.side-menu-overlay {
position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5);
z-index:1050; opacity:0; pointer-events:none; transition:opacity 0.3s;
}
.side-menu-overlay.open { opacity:1; pointer-events:all; }
.menu-header {
padding:20px; background:linear-gradient(135deg, var(--red-dark), var(--red));
color:#fff; position:sticky; top:0; z-index:10;
}
.menu-header h2 { font-size:1.2rem; }
.menu-close {
position:absolute; top:16px; right:16px; width:36px; height:36px;
border:none; background:rgba(255,255,255,0.15); border-radius:50%;
color:#fff; font-size:1.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.menu-tabs { display:flex; border-bottom:2px solid #eee; background:#fff; position:sticky; top:64px; z-index:9; }
.menu-tab-btn {
flex:1; padding:12px 8px; border:none; background:none; font-size:0.8rem;
font-weight:500; color:var(--text-light); cursor:pointer; transition:all 0.2s;
border-bottom:3px solid transparent; font-family:inherit;
}
.menu-tab-btn.active { color:var(--red); border-bottom-color:var(--red); }
.menu-content { padding:16px; }
/* Checklist */
.check-item {
border-radius:12px; margin-bottom:8px; background:#fff;
box-shadow:0 2px 8px rgba(0,0,0,0.06); transition:all 0.2s;
overflow:hidden;
}
.check-item:hover { box-shadow:0 4px 16px rgba(0,0,0,0.1); }
.check-item-header {
display:flex; align-items:flex-start; gap:10px; padding:12px;
cursor:pointer; transition:background 0.2s;
}
.check-item-header:hover { background:rgba(192,57,43,0.04); }
.check-item.has-details .check-item-header { padding-right:36px; position:relative; }
.check-item.has-details .check-item-header::after {
content:''; position:absolute; right:14px; top:50%; transform:translateY(-50%) rotate(0deg);
width:8px; height:8px; border-right:2px solid var(--text-light); border-bottom:2px solid var(--text-light);
transform:translateY(-50%) rotate(45deg); transition:transform 0.3s;
}
.check-item.expanded .check-item-header::after { transform:translateY(-50%) rotate(-135deg); }
.check-icon { font-size:1.2rem; flex-shrink:0; margin-top:2px; }
.check-text { font-size:0.85rem; line-height:1.5; flex:1; }
.check-text .owner { font-size:0.7rem; color:var(--text-light); display:block; margin-top:2px; }
.check-details {
max-height:0; overflow:hidden; transition:max-height 0.4s cubic-bezier(0.4,0,0.2,1);
background:#fafafa; border-top:0 solid #f0f0f0;
}
.check-item.expanded .check-details { border-top-width:1px; }
.check-details-inner { padding:12px 14px; }
.check-detail-group { margin-bottom:10px; }
.check-detail-group:last-child { margin-bottom:0; }
.check-detail-title { font-size:0.8rem; font-weight:600; color:var(--red-dark); margin-bottom:4px; }
.check-detail-item { font-size:0.78rem; color:var(--text); padding:2px 0 2px 14px; position:relative; line-height:1.6; }
.check-detail-item::before { content:'·'; position:absolute; left:2px; font-weight:700; color:var(--red); }
/* Locations */
.loc-item {
padding:14px; border-radius:12px; margin-bottom:10px; background:#fff;
box-shadow:0 2px 8px rgba(0,0,0,0.06); cursor:pointer; transition:all 0.2s;
}
.loc-item:hover { box-shadow:0 4px 16px rgba(0,0,0,0.12); transform:translateY(-1px); }
.loc-name { font-weight:700; font-size:0.95rem; color:var(--red-dark); margin-bottom:4px; }
.loc-addr { font-size:0.8rem; color:var(--text-light); margin-bottom:6px; }
.loc-link { font-size:0.75rem; color:var(--blue); text-decoration:none; }
.loc-link:hover { text-decoration:underline; }
/* Flow */
.flow-day { margin-bottom:24px; }
.flow-day-title {
font-size:1rem; font-weight:700; color:var(--red); margin-bottom:12px;
padding-bottom:8px; border-bottom:2px solid var(--red-light);
}
.flow-item {
display:flex; gap:12px; padding:10px 0; border-bottom:1px solid #f0f0f0;
position:relative; padding-left:20px;
}
.flow-item::before {
content:''; position:absolute; left:4px; top:16px;
width:10px; height:10px; border-radius:50%; background:var(--red);
}
.flow-item::after {
content:''; position:absolute; left:8px; top:26px; bottom:-2px;
width:2px; background:#eee;
}
.flow-item:last-child::after { display:none; }
.flow-time { font-size:0.75rem; color:var(--text-light); min-width:60px; padding-top:2px; }
.flow-desc { font-size:0.85rem; line-height:1.5; }
/* ===== BOTTOM DETAIL PANEL ===== */
.detail-panel {
position:fixed; bottom:-100%; left:0; right:0; z-index:900;
background:var(--panel-bg); border-radius:24px 24px 0 0;
box-shadow:0 -8px 40px rgba(0,0,0,0.2);
transition:bottom 0.5s cubic-bezier(0.4,0,0.2,1);
max-height:55vh; overflow-y:auto;
}
.detail-panel.open { bottom:0; }
.detail-handle {
width:40px; height:4px; background:#ccc; border-radius:4px;
margin:10px auto 0; cursor:pointer;
}
.detail-close {
position:absolute; top:12px; right:16px; width:32px; height:32px;
border:none; background:rgba(0,0,0,0.08); border-radius:50%;
font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.detail-content { padding:16px 20px 28px; }
.detail-title {
font-size:1.3rem; font-weight:900; color:var(--red-dark); margin-bottom:4px;
}
.detail-type { font-size:0.75rem; color:var(--text-light); margin-bottom:16px; }
.detail-section { margin-bottom:16px; }
.detail-section h4 {
font-size:0.85rem; color:var(--red); margin-bottom:8px;
padding-bottom:4px; border-bottom:1px solid #f0e0e0;
}
.detail-row { font-size:0.85rem; line-height:1.7; color:var(--text); }
.detail-row a { color:var(--blue); text-decoration:none; }
.detail-row a:hover { text-decoration:underline; }
.detail-tag {
display:inline-block; padding:3px 10px; border-radius:20px;
font-size:0.7rem; font-weight:600; margin:2px 4px 2px 0;
}
.tag-meal { background:#ffeaea; color:var(--red); }
.tag-activity { background:#e8f4fd; color:var(--blue); }
.tag-shop { background:#e8fce8; color:var(--green); }
/* ===== CUSTOM MARKERS ===== */
.custom-marker {
width:36px; height:36px; border-radius:50%;
display:flex; align-items:center; justify-content:center;
font-size:14px; color:#fff; font-weight:700;
box-shadow:0 3px 12px rgba(0,0,0,0.3);
border:3px solid #fff; transition:all 0.3s;
cursor:pointer;
}
.custom-marker:hover { transform:scale(1.2); }
.marker-stay { background:var(--red); }
.marker-restaurant { background:var(--orange); }
.marker-activity { background:var(--blue); }
.marker-shop { background:var(--green); }
.custom-marker.active { transform:scale(1.3); box-shadow:0 4px 20px rgba(192,57,43,0.5); }
/* ===== ROUTE ANIMATION ===== */
.moving-car {
width:32px; height:32px;
display:flex; align-items:center; justify-content:center;
font-size:24px; line-height:1;
filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5)) drop-shadow(0 0 10px rgba(244,196,48,0.5));
transition:transform 0.15s linear;
}
.route-arrow-marker {
opacity:0; animation:arrowFadeIn 0.4s ease forwards;
}
@keyframes arrowFadeIn {
0% { opacity:0; transform:scale(0.3); }
100% { opacity:1; transform:scale(1); }
}
.custom-marker.marker-arrive {
animation:markerArrive 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes markerArrive {
0% { transform:scale(1); box-shadow:0 3px 12px rgba(0,0,0,0.3); }
40% { transform:scale(1.5); box-shadow:0 0 20px 6px rgba(244,196,48,0.5); }
100% { transform:scale(1); box-shadow:0 3px 12px rgba(0,0,0,0.3); }
}
.route-segment { transition:opacity 0.3s; }
.label-icon-wrapper {
width:0 !important; height:0 !important;
overflow:visible !important; border:none !important; background:none !important;
}
.arrival-label {
display:inline-block;
background:rgba(26,26,46,0.92); color:#fff;
padding:6px 12px; border-radius:10px;
font-size:0.75rem; line-height:1.4;
white-space:nowrap; pointer-events:none;
box-shadow:0 3px 12px rgba(0,0,0,0.25);
animation:labelFadeIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
opacity:0; transform:translateY(6px);
}
.arrival-label .label-name { font-weight:700; font-size:0.8rem; }
.arrival-label .label-time { color:var(--gold-light); font-size:0.7rem; margin-top:2px; }
@keyframes labelFadeIn {
0% { opacity:0; transform:translateY(6px); }
100% { opacity:1; transform:translateY(0); }
}
/* ===== WEATHER BADGE ===== */
.weather-badge {
position:fixed; bottom:20px; left:20px; z-index:800;
background:rgba(26,26,46,0.88); backdrop-filter:blur(8px);
color:#fff; padding:10px 16px; border-radius:14px;
font-size:0.75rem; box-shadow:0 4px 16px rgba(0,0,0,0.2);
transition:all 0.3s;
}
.detail-panel.open ~ .weather-badge { bottom:calc(55vh + 10px); }
.weather-day { display:flex; align-items:center; gap:8px; padding:3px 0; }
.weather-temp { color:var(--gold); font-weight:700; }
.weather-outfit { font-size:0.7rem; color:rgba(255,255,255,0.7); padding:5px 0 0; margin-top:5px; border-top:1px solid rgba(255,255,255,0.15); line-height:1.5; }
/* ===== RWD ===== */
@media(max-width:768px) {
.header h1 { font-size:1.1rem; }
.header .subtitle { display:none; }
.side-menu { width:100vw; max-width:100vw; right:-100vw; }
.detail-panel { max-height:65vh; }
.weather-badge { bottom:12px; left:12px; font-size:0.7rem; padding:8px 12px; }
}
@media(max-width:480px) {
.header { padding:10px 14px; }
.header h1 { font-size:1rem; }
.timeline-bar { top:60px; padding:8px 12px; }
.day-tab { padding:6px 14px; font-size:0.75rem; }
}
/* hide leaflet attribution clutter */
.leaflet-control-attribution { font-size:9px !important; }
/* ===== WEATHER EFFECTS OVERLAY ===== */
.weather-overlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  z-index:2; pointer-events:none; overflow:hidden;
  transition:opacity 0.6s ease;
}
/* --- Day Transition Flash --- */
.day-transition {
  position:fixed; top:0; left:0; width:100%; height:100%;
  z-index:3; pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(255,255,255,0.9), rgba(255,248,240,0.6));
  opacity:0; transition:opacity 0.3s ease;
}
.day-transition.active {
  animation:dayFlash 0.7s ease-out forwards;
}
@keyframes dayFlash {
  0% { opacity:0; }
  20% { opacity:1; }
  100% { opacity:0; }
}
/* --- SUNNY EFFECT (Day 1) --- */
.sun-glow {
  position:absolute; top:-80px; right:-80px;
  width:280px; height:280px;
  background:radial-gradient(circle, rgba(244,196,48,0.45) 0%, rgba(244,196,48,0.15) 40%, transparent 70%);
  border-radius:50%;
  animation:sunPulse 4s ease-in-out infinite;
}
@keyframes sunPulse {
  0%,100% { transform:scale(1); opacity:0.8; }
  50% { transform:scale(1.15); opacity:1; }
}
.sun-ray {
  position:absolute; top:60px; right:60px;
  width:200px; height:200px;
  animation:sunSpin 20s linear infinite;
}
@keyframes sunSpin {
  from { transform:rotate(0deg); }
  to { transform:rotate(360deg); }
}
.sun-ray-beam {
  position:absolute; top:50%; left:50%;
  width:3px; height:120px;
  background:linear-gradient(to bottom, rgba(244,196,48,0.5), transparent);
  transform-origin:top center;
  border-radius:2px;
}
.sun-sparkle {
  position:absolute;
  width:4px; height:4px;
  background:rgba(255,230,140,0.9);
  border-radius:50%;
  box-shadow:0 0 6px 2px rgba(244,196,48,0.4);
  animation:sparkle 3s ease-in-out infinite;
}
@keyframes sparkle {
  0%,100% { opacity:0; transform:scale(0.5); }
  50% { opacity:1; transform:scale(1.2); }
}
/* --- CLOUDY EFFECT (Day 2) --- */
.cloud {
  position:absolute;
  background:radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.85), rgba(220,220,230,0.4) 70%, transparent 100%);
  border-radius:50%;
  filter:blur(2px);
  animation:cloudFloat linear infinite;
}
@keyframes cloudFloat {
  from { transform:translateX(-200px); }
  to { transform:translateX(calc(100vw + 200px)); }
}
.drizzle-drop {
  position:absolute;
  width:1.5px;
  background:linear-gradient(to bottom, transparent, rgba(174,194,224,0.6));
  border-radius:0 0 2px 2px;
  animation:drizzleFall linear infinite;
}
@keyframes drizzleFall {
  0% { transform:translateY(-20px); opacity:0; }
  10% { opacity:1; }
  90% { opacity:0.6; }
  100% { transform:translateY(100vh); opacity:0; }
}
/* --- RAINY EFFECT (Day 3) --- */
.rain-overlay-tint {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:linear-gradient(180deg, rgba(100,110,130,0.15) 0%, rgba(80,90,110,0.08) 100%);
}
.rain-drop {
  position:absolute;
  width:2px;
  background:linear-gradient(to bottom, transparent, rgba(174,194,224,0.8));
  border-radius:0 0 2px 2px;
  animation:rainFall linear infinite;
}
@keyframes rainFall {
  0% { transform:translateY(-30px) rotate(8deg); opacity:0; }
  8% { opacity:1; }
  85% { opacity:0.7; }
  100% { transform:translateY(100vh) rotate(8deg); opacity:0; }
}
.rain-splash {
  position:absolute; bottom:0;
  width:6px; height:3px;
  border-radius:50%;
  background:rgba(174,194,224,0.3);
  animation:splash 1.8s ease-out infinite;
}
@keyframes splash {
  0% { transform:scale(0); opacity:1; }
  50% { transform:scale(2.5); opacity:0.4; }
  100% { transform:scale(0); opacity:0; }
}
.rain-mist {
  position:absolute; bottom:0; left:0; width:100%; height:15%;
  background:linear-gradient(to top, rgba(180,195,220,0.12), transparent);
  animation:mistPulse 5s ease-in-out infinite;
}
@keyframes mistPulse {
  0%,100% { opacity:0.5; }
  50% { opacity:1; }
}
/* responsive adjustments */
@media(max-width:768px) {
  .sun-glow { width:180px; height:180px; top:-50px; right:-50px; }
  .sun-ray { width:140px; height:140px; top:40px; right:40px; }
}
</style>
</head>
<body>
<!-- HEADER -->
<div class="header">
<div style="display:flex;align-items:baseline;">
<h1>🧧 過年宜蘭行</h1>
<span class="subtitle">2/15 小年夜 — 2/17 初一 ｜ 18人</span>
</div>
<button class="menu-btn" id="menuBtn" onclick="toggleMenu()">
<span></span><span></span><span></span>
</button>
</div>
<!-- TIMELINE -->
<div class="timeline-bar">
<button class="day-tab active" onclick="showDay('all',this)">全覽</button>
<button class="day-tab" onclick="showDay(1,this)">Day1 · 2/15 小年夜</button>
<button class="day-tab" onclick="showDay(2,this)">Day2 · 2/16 除夕</button>
<button class="day-tab" onclick="showDay(3,this)">Day3 · 2/17 初一</button>
</div>
<!-- MAP -->
<div id="map"></div>
<!-- SIDE MENU -->
<div class="side-menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
<div class="side-menu" id="sideMenu">
<div class="menu-header">
<h2>📋 選單</h2>
<button class="menu-close" onclick="toggleMenu()">✕</button>
</div>
<div class="menu-tabs">
<button class="menu-tab-btn active" onclick="switchMenuTab('checklist',this)">待辦清單</button>
<button class="menu-tab-btn" onclick="switchMenuTab('locations',this)">所有地點</button>
<button class="menu-tab-btn" onclick="switchMenuTab('flow',this)">活動流程</button>
</div>
<div class="menu-content" id="menuContent"></div>
</div>
<!-- DETAIL PANEL -->
<div class="detail-panel" id="detailPanel">
<div class="detail-handle" onclick="closeDetail()"></div>
<button class="detail-close" onclick="closeDetail()">✕</button>
<div class="detail-content" id="detailContent"></div>
</div>
<!-- WEATHER EFFECTS -->
<div class="weather-overlay" id="weatherOverlay"></div>
<div class="day-transition" id="dayTransition"></div>
<!-- WEATHER -->
<div class="weather-badge" id="weatherBadge"></div>
<script>
document.addEventListener('DOMContentLoaded', function() {
// ===== DATA =====
const locations = [
  {
id:'bnb', name:'小慕洋民宿', type:'stay', lat:24.6920, lng:121.7880,
addr:'宜蘭縣五結鄉', phone:'0970-663-333',
web:'https://tw-bnb.com/web/muse/',
gmap:'https://www.google.com/maps/search/慕洋民宿+宜蘭五結',
facilities:'唱歌、電動麻將×2台、游泳池、獨立遊戲室、籃球場、盪鞦韆',
rooms:'6間房：2人房×1、4人房×4、6人房×1（共可容納24人）',
days:[1,2,3],
schedule:[
      {day:1, time:'15:00後', desc:'入住 check-in'},
      {day:1, time:'晚上', desc:'百匯窯烤雞外帶晚餐、唱歌、麻將'},
      {day:2, time:'07:30', desc:'外送早餐'},
      {day:2, time:'中午', desc:'火鍋＋壽司午餐'},
      {day:2, time:'晚上', desc:'年夜飯：佛跳牆、海鮮大餐'},
      {day:3, time:'07:30', desc:'外送早餐'},

const toRad = x => x * Math.PI / 180;
const dLng = toRad(p2[1] - p1[1]);
const lat1 = toRad(p1[0]), lat2 = toRad(p2[0]);
const y = Math.sin(dLng) * Math.cos(lat2);
const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function clearRoutes() {
animationAborted = true;
if(animationId) { cancelAnimationFrame(animationId); animationId = null; }
routeLines.forEach(l => map.removeLayer(l));
routeLines = [];
if(movingDot) { map.removeLayer(movingDot); movingDot = null; }
arrivalLabels.forEach(l => map.removeLayer(l));
arrivalLabels = [];
routeArrows.forEach(l => map.removeLayer(l));
routeArrows = [];
}

function showArrivalLabel(locId, day) {
const loc = locations.find(l => l.id === locId);
if(!loc) return;
const sch = loc.schedule.find(s => s.day === day);
const time = sch ? sch.time : '';
const icon = typeIcons[loc.type] || '';
const labelIcon = L.divIcon({
  className:'label-icon-wrapper',
  iconAnchor:[-22, 18],
  html:`<div class="arrival-label"><div class="label-name">${icon} ${loc.name}</div>${time?`<div class="label-time">${time}</div>`:''}</div>`
});
const labelMarker = L.marker([loc.lat, loc.lng], {icon:labelIcon, interactive:false, zIndexOffset:8000}).addTo(map);
arrivalLabels.push(labelMarker);
}

function pulseMarker(locId) {
const el = document.querySelector(`.custom-marker[data-id="${locId}"]`);
if(!el) return;
el.classList.remove('marker-arrive');
void el.offsetWidth;
el.classList.add('marker-arrive');
setTimeout(() => el.classList.remove('marker-arrive'), 700);
}

function addRouteArrows(from, to, color) {
const b = bearing(from, to);
[0.3, 0.65].forEach(t => {
  const pos = lerpPoint(from, to, t);
  const icon = L.divIcon({
    className:'', iconSize:[12,16], iconAnchor:[6,8],
    html:`<div class="route-arrow-marker"><svg width="12" height="16" viewBox="0 0 12 16" style="transform:rotate(${b}deg)"><path d="M6 0L12 16L6 11L0 16Z" fill="${color}" opacity="0.75"/></svg></div>`
  });
  routeArrows.push(L.marker(pos, {icon, interactive:false, zIndexOffset:5000}).addTo(map));
});
}

function animateSegment(from, to, color, duration) {
return new Promise(resolve => {
  const line = L.polyline([from, from], {
    color, weight:5, opacity:0.85, lineCap:'round', lineJoin:'round',
    className:'route-segment'
  }).addTo(map);
  routeLines.push(line);

  const b = bearing(from, to);
  if(!movingDot) {
    const carIcon = L.divIcon({ className:'', iconSize:[32,32], iconAnchor:[16,16],
      html:`<div class="moving-car" style="transform:rotate(${b + 90}deg)">🚗</div>`
    });
    movingDot = L.marker(from, {icon:carIcon, zIndexOffset:9999}).addTo(map);
  } else {
    const el = movingDot.getElement();
    if(el) { const a = el.querySelector('.moving-car'); if(a) a.style.transform = `rotate(${b + 90}deg)`; }
  }

  const startTime = performance.now();
  const savedAborted = animationAborted;

  function step(now) {
    if(animationAborted !== savedAborted) { resolve(); return; }
    const t = Math.min((now - startTime) / duration, 1);
    const eased = t < 0.5 ? 2*t*t : -1+(4-2*t)*t; // easeInOut
    const current = lerpPoint(from, to, eased);
    line.setLatLngs([from, current]);
    if(movingDot) movingDot.setLatLng(current);
    if(t < 1) { animationId = requestAnimationFrame(step); }
    else { addRouteArrows(from, to, color); resolve(); }
  }
  animationId = requestAnimationFrame(step);
});
}

function segmentZoom(p1, p2) {
const dist = Math.sqrt(Math.pow(p1[0]-p2[0],2) + Math.pow(p1[1]-p2[1],2));
if(dist > 0.12) return 12;
if(dist > 0.05) return 13;
if(dist > 0.02) return 14;
return 15;
}

function panToSegment(p1, p2) {
const mid = lerpPoint(p1, p2, 0.5);
const zoom = segmentZoom(p1, p2);
map.flyTo(mid, zoom, {duration:0.8, easeLinearity:0.4});
}

async function drawRoute(day) {
clearRoutes();
animationAborted = false;
const ids = dayRoutes[day];
if(!ids) return;
const points = ids.map(id => {
  const loc = locations.find(l=>l.id===id);
  return { latLng:[loc.lat, loc.lng], id:loc.id };
});

// Zoom to start point
map.flyTo(points[0].latLng, 14, {duration:0.8});
await new Promise(r => setTimeout(r, 900));
const segDuration = 1000;

// Pulse start marker
pulseMarker(points[0].id);
showArrivalLabel(points[0].id, day);
await new Promise(r => setTimeout(r, 400));

for(let i = 0; i < points.length - 1; i++) {
  if(animationAborted) return;
  // Pan map to show current segment
  panToSegment(points[i].latLng, points[i+1].latLng);
  await new Promise(r => setTimeout(r, 500));
  if(animationAborted) return;
  await animateSegment(points[i].latLng, points[i+1].latLng, routeColors[day], segDuration);
  if(animationAborted) return;
  pulseMarker(points[i+1].id);
  showArrivalLabel(points[i+1].id, day);
  if(i < points.length - 2) await new Promise(r => setTimeout(r, 300));
}

// Zoom out to show full route
await new Promise(r => setTimeout(r, 500));
if(!animationAborted) {
  map.fitBounds(points.map(p=>p.latLng), {padding:[80,50], maxZoom:14, duration:1});
}

// Fade out dot
if(movingDot) {
  const dotEl = movingDot.getElement();
  if(dotEl) { dotEl.style.transition = 'opacity 0.8s'; dotEl.style.opacity = '0'; }
  setTimeout(() => { if(movingDot) { map.removeLayer(movingDot); movingDot = null; } }, 900);
}
}

async function drawAllRoutes() {
clearRoutes();
animationAborted = false;
map.fitBounds(locations.map(l=>[l.lat,l.lng]), {padding:[80,60]});
await new Promise(r => setTimeout(r, 600));

for(const d of [1,2,3]) {
  if(animationAborted) return;
  const ids = dayRoutes[d];
  const points = ids.map(id => {
    const loc = locations.find(x=>x.id===id);
    return { latLng:[loc.lat,loc.lng], id:loc.id };
  });

  // Zoom to start of this day's route
  map.flyTo(points[0].latLng, 14, {duration:0.7});
  await new Promise(r => setTimeout(r, 800));

  pulseMarker(points[0].id);
  showArrivalLabel(points[0].id, d);
  await new Promise(r => setTimeout(r, 300));

  for(let i = 0; i < points.length - 1; i++) {
    if(animationAborted) return;
    panToSegment(points[i].latLng, points[i+1].latLng);
    await new Promise(r => setTimeout(r, 400));
    if(animationAborted) return;
    await animateSegment(points[i].latLng, points[i+1].latLng, routeColors[d], 700);
    if(animationAborted) return;
    pulseMarker(points[i+1].id);
    showArrivalLabel(points[i+1].id, d);
    if(i < points.length - 2) await new Promise(r => setTimeout(r, 200));
  }
  if(d < 3) await new Promise(r => setTimeout(r, 400));
}

// Zoom out to show all routes
await new Promise(r => setTimeout(r, 400));
if(!animationAborted) {
  map.fitBounds(locations.map(l=>[l.lat,l.lng]), {padding:[80,60], duration:1});
}

// Fade out dot
if(movingDot) {
  const dotEl = movingDot.getElement();
  if(dotEl) { dotEl.style.transition = 'opacity 0.8s'; dotEl.style.opacity = '0'; }
  setTimeout(() => { if(movingDot) { map.removeLayer(movingDot); movingDot = null; } }, 900);
}
}
// ===== WEATHER EFFECTS =====
let currentWeatherDay = 'all';

function createSunnyEffect(container) {
  // Sun glow
  const glow = document.createElement('div');
  glow.className = 'sun-glow';
  container.appendChild(glow);
  // Rotating rays
  const rayContainer = document.createElement('div');
  rayContainer.className = 'sun-ray';
  for (let i = 0; i < 12; i++) {
    const beam = document.createElement('div');
    beam.className = 'sun-ray-beam';
    beam.style.transform = `rotate(${i * 30}deg)`;
    rayContainer.appendChild(beam);
  }
  container.appendChild(rayContainer);
  // Sparkles
  for (let i = 0; i < 15; i++) {
    const sparkle = document.createElement('div');
    sparkle.className = 'sun-sparkle';
    sparkle.style.top = (5 + Math.random() * 40) + '%';
    sparkle.style.left = (40 + Math.random() * 55) + '%';
    sparkle.style.animationDelay = (Math.random() * 3) + 's';
    sparkle.style.animationDuration = (2 + Math.random() * 2) + 's';
    container.appendChild(sparkle);
  }
}

function createCloudyEffect(container) {
  // Clouds
  const cloudSizes = [
    {w:180, h:60, top:'8%', dur:35, delay:0, opacity:0.7},
    {w:240, h:80, top:'5%', dur:45, delay:8, opacity:0.6},
    {w:140, h:50, top:'15%', dur:30, delay:15, opacity:0.5},
    {w:200, h:65, top:'3%', dur:50, delay:22, opacity:0.55},
    {w:160, h:55, top:'12%', dur:38, delay:5, opacity:0.45},
  ];
  cloudSizes.forEach(c => {
    const cloud = document.createElement('div');
    cloud.className = 'cloud';
    cloud.style.width = c.w + 'px';
    cloud.style.height = c.h + 'px';
    cloud.style.top = c.top;
    cloud.style.animationDuration = c.dur + 's';
    cloud.style.animationDelay = -c.delay + 's';
    cloud.style.opacity = c.opacity;
    container.appendChild(cloud);
  });
  // Light drizzle
  for (let i = 0; i < 30; i++) {
    const drop = document.createElement('div');
    drop.className = 'drizzle-drop';
    drop.style.left = Math.random() * 100 + '%';
    drop.style.height = (8 + Math.random() * 12) + 'px';
    drop.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
    drop.style.animationDelay = Math.random() * 3 + 's';
    container.appendChild(drop);
  }
}

function createRainyEffect(container) {
  // Dark tint overlay
  const tint = document.createElement('div');
  tint.className = 'rain-overlay-tint';
  container.appendChild(tint);
  // Rain drops
  for (let i = 0; i < 80; i++) {
    const drop = document.createElement('div');
    drop.className = 'rain-drop';
    drop.style.left = Math.random() * 100 + '%';
    drop.style.height = (14 + Math.random() * 18) + 'px';
    drop.style.animationDuration = (0.6 + Math.random() * 0.6) + 's';
    drop.style.animationDelay = Math.random() * 2 + 's';
    container.appendChild(drop);
  }
  // Splashes at bottom
  for (let i = 0; i < 15; i++) {
    const splash = document.createElement('div');
    splash.className = 'rain-splash';
    splash.style.left = Math.random() * 100 + '%';
    splash.style.animationDelay = Math.random() * 2 + 's';
    splash.style.animationDuration = (1.2 + Math.random() * 1) + 's';
    container.appendChild(splash);
  }
  // Bottom mist
  const mist = document.createElement('div');
  mist.className = 'rain-mist';
  container.appendChild(mist);
  // A few heavier clouds
  const cloudSizes = [
    {w:220, h:70, top:'3%', dur:40, delay:0, opacity:0.6},
    {w:280, h:90, top:'0%', dur:55, delay:12, opacity:0.5},
    {w:180, h:60, top:'8%', dur:35, delay:25, opacity:0.45},
  ];
  cloudSizes.forEach(c => {
    const cloud = document.createElement('div');
    cloud.className = 'cloud';
    cloud.style.width = c.w + 'px';
    cloud.style.height = c.h + 'px';
    cloud.style.top = c.top;
    cloud.style.animationDuration = c.dur + 's';
    cloud.style.animationDelay = -c.delay + 's';
    cloud.style.opacity = c.opacity;
    container.appendChild(cloud);
  });
}

function triggerDayTransition() {
  const el = document.getElementById('dayTransition');
  el.classList.remove('active');
  void el.offsetWidth; // force reflow
  el.classList.add('active');
  setTimeout(() => el.classList.remove('active'), 800);
}

function updateWeatherEffect(day) {
  const overlay = document.getElementById('weatherOverlay');
  // Fade out
  overlay.style.opacity = '0';
  setTimeout(() => {
    overlay.innerHTML = '';
    if (day === 'all') {
      // No weather effect in overview mode
      overlay.style.opacity = '1';
      return;
    }
    switch(day) {
      case 1: createSunnyEffect(overlay); break;
      case 2: createCloudyEffect(overlay); break;
      case 3: createRainyEffect(overlay); break;
    }
    // Fade in
    overlay.style.opacity = '1';
  }, 350);
}

// ===== DAY FILTER =====
function showDay(day, btn) {
document.querySelectorAll('.day-tab').forEach(t=>t.classList.remove('active'));
btn.classList.add('active');
// Trigger transition effect
if (currentWeatherDay !== day) {
  triggerDayTransition();
  currentWeatherDay = day;
}
// Show/hide markers
locations.forEach(loc => {
const m = markers[loc.id];
if(day==='all' || loc.days.includes(day)) {
m.setOpacity(1);
    } else {
m.setOpacity(0.2);
    }
  });
updateWeather(day);
updateWeatherEffect(day);
if(day==='all') drawAllRoutes();
else drawRoute(day);
}
// ===== WEATHER UPDATE =====
function updateWeather(day) {
const badge = document.getElementById('weatherBadge');
const days = day === 'all' ? weatherData : weatherData.filter(w => w.day === day);
let html = '';
days.forEach(w => {
  html += `<div class="weather-day">${w.icon} ${w.date}：<span class="weather-temp">${w.temp}</span> ${w.desc} 降雨${w.rain}</div>`;
});
const outfits = days.map(w => `${w.icon} ${w.outfit}`).join('<br>');
html += `<div class="weather-outfit">👔 ${days.length > 1 ? '穿搭建議' : '今日穿搭'}<br>${outfits}</div>`;
badge.innerHTML = html;
}
// ===== DETAIL PANEL =====
function openDetail(id) {
const loc = locations.find(l=>l.id===id);
if(!loc) return;
// Highlight marker
document.querySelectorAll('.custom-marker').forEach(m=>m.classList.remove('active'));
const markerEl = document.querySelector(`.custom-marker[data-id="${id}"]`);
if(markerEl) markerEl.classList.add('active');
map.panTo([loc.lat, loc.lng], {animate:true});
let html = `<div class="detail-title">${typeIcons[loc.type]} ${loc.name}</div>`;
html += `<div class="detail-type"><span class="detail-tag tag-${loc.type==='restaurant'?'meal':loc.type==='shop'?'shop':'activity'}">${typeLabels[loc.type]}</span></div>`;
// Basic info
html += `<div class="detail-section"><h4>📍 基本資訊</h4><div class="detail-row">`;
if(loc.addr) html += `<div>地址：${loc.addr}</div>`;
if(loc.phone) html += `<div>電話：${loc.phone}</div>`;
if(loc.hours) html += `<div>營業時間：${loc.hours}</div>`;
if(loc.rooms) html += `<div>房間：${loc.rooms}</div>`;
if(loc.facilities) html += `<div>設施：${loc.facilities}</div>`;
if(loc.note) html += `<div style="margin-top:4px;color:var(--orange);font-size:0.8rem;">💡 ${loc.note}</div>`;
if(loc.gmap) html += `<div style="margin-top:6px;"><a href="${loc.gmap}" target="_blank">📍 Google Maps 導航 →</a></div>`;
if(loc.web) html += `<div><a href="${loc.web}" target="_blank">🌐 官網 →</a></div>`;
html += `</div></div>`;
// Schedule
if(loc.schedule && loc.schedule.length) {
html += `<div class="detail-section"><h4>📅 行程安排</h4><div class="detail-row">`;
const dayNames = {1:'2/15 小年夜', 2:'2/16 除夕', 3:'2/17 初一'};
loc.schedule.forEach(s => {
html += `<div style="padding:4px 0;border-bottom:1px solid #f5f5f5;">
        <span style="color:var(--red);font-weight:600;">${dayNames[s.day]}</span>
        <span style="color:var(--text-light);margin:0 6px;">·</span>
        <span style="font-weight:500;">${s.time}</span>
        <span style="color:var(--text-light);margin:0 6px;">·</span>
${s.desc}
      </div>`;
    });
html += `</div></div>`;
  }
// Family info
if(loc.familyInfo && loc.familyInfo.length) {
html += `<div class="detail-section"><h4>👨‍👩‍👧‍👦 家庭資訊</h4>`;
loc.familyInfo.forEach(fi => {
html += `<div style="margin-bottom:10px;padding:10px;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,0.05);">`;
html += `<div style="font-weight:600;font-size:0.85rem;color:var(--red-dark);margin-bottom:4px;">${fi.title}</div>`;
fi.items.forEach(item => {
html += `<div style="font-size:0.8rem;padding:2px 0;padding-left:12px;position:relative;">
          <span style="position:absolute;left:0;">·</span>${item}</div>`;
      });
html += `</div>`;
    });
html += `</div>`;
  }
document.getElementById('detailContent').innerHTML = html;
document.getElementById('detailPanel').classList.add('open');
}
function closeDetail() {
document.getElementById('detailPanel').classList.remove('open');
document.querySelectorAll('.custom-marker').forEach(m=>m.classList.remove('active'));
}
// ===== SIDE MENU =====
function toggleMenu() {
const menu = document.getElementById('sideMenu');
const overlay = document.getElementById('menuOverlay');
const btn = document.getElementById('menuBtn');
const isOpen = menu.classList.contains('open');
menu.classList.toggle('open');
overlay.classList.toggle('open');
btn.classList.toggle('active');
if(!isOpen) switchMenuTab('checklist', document.querySelector('.menu-tab-btn'));
}
function switchMenuTab(tab, btn) {
document.querySelectorAll('.menu-tab-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
const container = document.getElementById('menuContent');
if(tab==='checklist') {
let html = '';
checklist.forEach((item,i) => {
  const hasDetails = item.details && item.details.length > 0;
  html += `<div class="check-item${hasDetails?' has-details':''}" id="chk-${i}">`;
  html += `<div class="check-item-header" ${hasDetails?`onclick="toggleCheckDetail(${i})"`:''}>`;
  html += `<span class="check-icon">${item.done?'✅':'⏳'}</span>`;
  html += `<div class="check-text">${item.text}<span class="owner">負責：${item.owner}</span></div>`;
  html += `</div>`;
  if(hasDetails) {
    html += `<div class="check-details" id="chk-detail-${i}"><div class="check-details-inner">`;
    item.details.forEach(d => {
      html += `<div class="check-detail-group"><div class="check-detail-title">${d.title}</div>`;
      d.items.forEach(it => { html += `<div class="check-detail-item">${it}</div>`; });
      html += `</div>`;
    });
    html += `</div></div>`;
  }
  html += `</div>`;
    });
container.innerHTML = html;
  }
else if(tab==='locations') {
let html = '';
locations.forEach(loc => {
html += `<div class="loc-item" onclick="goToLocation('${loc.id}')">
        <div class="loc-name">${typeIcons[loc.type]} ${loc.name}</div>
        <div class="loc-addr">${loc.addr||''}</div>
${loc.phone?`<div class="loc-addr">📞 ${loc.phone}</div>`:''}
        <a class="loc-link" href="${loc.gmap}" target="_blank" onclick="event.stopPropagation()">📍 Google Maps 導航 →</a>
      </div>`;
    });
container.innerHTML = html;
  }
else if(tab==='flow') {
let html = '';
flowData.forEach(day => {
html += `<div class="flow-day"><div class="flow-day-title">${day.title}</div>`;
day.items.forEach(item => {
html += `<div class="flow-item">
          <div class="flow-time">${item.time}</div>
          <div class="flow-desc">${item.desc}</div>
        </div>`;
      });
html += `</div>`;
    });
container.innerHTML = html;
  }
}
function toggleCheckDetail(i) {
const item = document.getElementById('chk-'+i);
const detail = document.getElementById('chk-detail-'+i);
if(!item || !detail) return;
if(item.classList.contains('expanded')) {
  item.classList.remove('expanded');
  detail.style.maxHeight = '0';
} else {
  item.classList.add('expanded');
  detail.style.maxHeight = detail.scrollHeight + 'px';
}
}
function goToLocation(id) {
toggleMenu();
setTimeout(()=>openDetail(id), 400);
}
// ===== INIT =====
updateWeather('all');
updateWeatherEffect('all');
drawAllRoutes();
// Expose functions to global scope for onclick handlers
window.showDay = showDay;
window.toggleMenu = toggleMenu;
window.switchMenuTab = switchMenuTab;
window.goToLocation = goToLocation;
window.openDetail = openDetail;
window.closeDetail = closeDetail;
window.toggleCheckDetail = toggleCheckDetail;
}); // end DOMContentLoaded
</script>
